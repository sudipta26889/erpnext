# TaskPilot ERPNext (fork) - production stack.
#
# Originally generated (not hand-written) from frappe/frappe_docker's own compose files, vendored
# unmodified in ./frappe_docker, via the exact command frappe_docker's docs recommend for a custom
# build:
#
#   cd frappe_docker && docker compose --env-file ../.env \
#     -f compose.yaml -f overrides/compose.mariadb.yaml -f overrides/compose.redis.yaml \
#     -f overrides/compose.noproxy.yaml config --no-interpolate > ../compose.yaml
#
# --no-interpolate keeps ${VAR} references literal (secrets stay in .env, not baked into this
# file) while still resolving the override merges. NOTE: a top-level `include:` pointing at the
# same 4 files was tried first and silently dropped the override files' values (e.g. configurator
# kept DB_HOST empty instead of "db") - this compose version's `include:` merge order doesn't
# match plain multi -f behavior for this case, so we generate a flat file instead. If you ever
# regenerate this file from upstream, drop `overrides/compose.redis.yaml` from the -f list (or
# re-apply the redis-externalization edit below) since redis-cache/redis-queue are no longer used
# here.
#
# Redis cutover (earlier edit): the bundled redis-cache/redis-queue containers were removed. The
# configurator now points REDIS_CACHE/REDIS_QUEUE (from .env, host:port/db form with inline auth)
# at the user's shared external Redis instead. See .env / .env.example for the values.
#
# Postgres cutover (this edit): the bundled `db` (MariaDB) container was removed. The configurator
# now points DB_HOST/DB_PORT/DB_TYPE (from .env) at the user's remote PostgreSQL instance instead.
# The site itself (site_config.json) carries db_type/db_host/db_port/db_name/db_user/db_password
# directly (frappe/installer.py writes these at `bench new-site` time and they take precedence over
# common_site_config) - the configurator's globals are set too for consistency/defaults only.
#
# Topology: configurator (one-shot) + backend (gunicorn) + frontend (nginx) + websocket (socketio)
# + queue-short/queue-long (rq workers) + scheduler, backed by external Postgres + external Redis.
# Only frontend is port-published (${HTTP_PUBLISH_PORT}, see .env). Everything else stays on the
# compose-internal network. If you ever regenerate this file from upstream, also drop
# `overrides/compose.mariadb.yaml` from the -f list (or re-apply this edit) since `db` is gone.
name: erpnext-prod
networks:
  default:
    name: erpnext-prod_default
services:
  backend:
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
    networks:
      default: null
    platform: linux/amd64
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - source: sites
        target: /home/frappe/frappe-bench/sites
        type: volume
        volume: {}
  configurator:
    command:
      - |
        ls -1 apps > sites/apps.txt; bench set-config -g db_type $$DB_TYPE; bench set-config -g db_host $$DB_HOST; bench set-config -gp db_port $$DB_PORT; bench set-config -g redis_cache "redis://$$REDIS_CACHE"; bench set-config -g redis_queue "redis://$$REDIS_QUEUE"; bench set-config -g redis_socketio "redis://$$REDIS_QUEUE"; bench set-config -gp socketio_port $$SOCKETIO_PORT; bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    entrypoint:
      - bash
      - -c
    environment:
      - DB_TYPE=${DB_TYPE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - REDIS_CACHE=${REDIS_CACHE}
      - REDIS_QUEUE=${REDIS_QUEUE}
      - SOCKETIO_PORT=9000
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
    networks:
      default: null
    platform: linux/amd64
    pull_policy: ${PULL_POLICY:-always}
    restart: on-failure
    volumes:
      - source: sites
        target: /home/frappe/frappe-bench/sites
        type: volume
        volume: {}
  frontend:
    command:
      - nginx-entrypoint.sh
    depends_on:
      backend:
        condition: service_started
        required: true
      websocket:
        condition: service_started
        required: true
    environment:
      BACKEND: backend:8000
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
    networks:
      default: null
    platform: linux/amd64
    ports:
      - ${HTTP_PUBLISH_PORT:-8080}:8080
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - source: sites
        target: /home/frappe/frappe-bench/sites
        type: volume
        volume: {}
  queue-long:
    command: bench worker --queue long,default,short
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
    networks:
      default: null
    platform: linux/amd64
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - source: sites
        target: /home/frappe/frappe-bench/sites
        type: volume
        volume: {}
  queue-short:
    command: bench worker --queue short,default
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
    networks:
      default: null
    platform: linux/amd64
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - source: sites
        target: /home/frappe/frappe-bench/sites
        type: volume
        volume: {}
  scheduler:
    command: bench schedule
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
    networks:
      default: null
    platform: linux/amd64
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - source: sites
        target: /home/frappe/frappe-bench/sites
        type: volume
        volume: {}
  websocket:
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
    networks:
      default: null
    platform: linux/amd64
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - source: sites
        target: /home/frappe/frappe-bench/sites
        type: volume
        volume: {}
volumes:
  sites:
    name: erpnext-prod_sites
x-backend-defaults:
  depends_on:
    configurator:
      condition: service_completed_successfully
  image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
  pull_policy: ${PULL_POLICY:-always}
  restart: ${RESTART_POLICY:-unless-stopped}
  volumes:
    - sites:/home/frappe/frappe-bench/sites
x-customizable-image:
  image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
  pull_policy: ${PULL_POLICY:-always}
  restart: ${RESTART_POLICY:-unless-stopped}
x-depends-on-configurator:
  depends_on:
    configurator:
      condition: service_completed_successfully
